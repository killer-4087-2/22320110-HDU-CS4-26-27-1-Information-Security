name: security-ci

# Runs on every push and on every pull request, as the lab requires.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test-scan:
    name: Build, test, SAST and SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 is required for the built-in `node:sqlite` module.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------- tests
      - name: Unit and security tests
        run: npm test

      # ------------------------------------------------------------------ SAST
      - name: SAST - ESLint with eslint-plugin-security
        run: npx eslint src scripts --format stylish

      - name: SAST - write JSON report
        if: always()
        run: npx eslint src scripts --format json --output-file reports/sast-eslint.json || true

      # ------------------------------------------------------------------- SCA
      - name: SCA - npm audit (gate on high and critical, production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: SCA - write full audit report
        if: always()
        run: |
          mkdir -p reports
          npm audit --json > reports/sca-npm-audit.json || true

      - name: Summarise findings
        if: always()
        run: |
          echo "### Security scan summary" >> $GITHUB_STEP_SUMMARY
          node -e '
            const a = require("./reports/sca-npm-audit.json");
            const m = a.metadata?.vulnerabilities || {};
            console.log("npm audit ->", JSON.stringify(m));
          ' >> $GITHUB_STEP_SUMMARY || true
          if [ -f reports/sast-eslint.json ]; then
            node -e '
              const r = require("./reports/sast-eslint.json");
              const errors = r.reduce((n, f) => n + f.errorCount, 0);
              const warnings = r.reduce((n, f) => n + f.warningCount, 0);
              console.log(`eslint  -> ${errors} error(s), ${warnings} warning(s)`);
            ' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
